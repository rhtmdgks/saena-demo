name: SEO Audit

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  seo-audit:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://the-saena.ai
      
      - name: Run SEO Audit
        run: npm run seo:audit
        continue-on-error: true
        id: seo-audit
      
      - name: Start Next.js server
        run: npm start &
        env:
          PORT: 3000
      
      - name: Wait for server
        run: npx wait-on http://localhost:3000
      
      - name: Run Lighthouse CI
        run: npm run lighthouse:ci
        continue-on-error: true
        id: lighthouse
      
      - name: Upload Lighthouse results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            
            let comment = '## 🔍 SEO Audit Results\n\n';
            
            // SEO Audit 결과
            if ('${{ steps.seo-audit.outcome }}' === 'success') {
              comment += '✅ **SEO Audit**: PASSED\n\n';
            } else {
              comment += '❌ **SEO Audit**: FAILED\n\n';
              comment += 'Please check the workflow logs for details.\n\n';
            }
            
            // Lighthouse 결과
            if ('${{ steps.lighthouse.outcome }}' === 'success') {
              comment += '✅ **Lighthouse CI**: PASSED\n\n';
            } else {
              comment += '⚠️ **Lighthouse CI**: NEEDS IMPROVEMENT\n\n';
            }
            
            comment += '### Next Steps\n\n';
            comment += '1. Review the detailed logs in the workflow run\n';
            comment += '2. Fix any failing checks\n';
            comment += '3. Re-run the audit\n\n';
            comment += '📚 [SEO Implementation Guide](docs/seo-implementation-guide.md)\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      - name: Fail if audits failed
        if: steps.seo-audit.outcome == 'failure' || steps.lighthouse.outcome == 'failure'
        run: exit 1
