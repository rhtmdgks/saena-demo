<!-- Google Search Console 소유권 인증 파일 -->
<!-- 
사용 방법:
1. https://search.google.com/search-console 접속
2. "속성 추가" 클릭
3. "URL 접두어" 선택 후 도메인 입력
4. "HTML 파일" 방법 선택
5. 제공된 파일명으로 이 파일 이름 변경
   예: google1234567890abcdef.html
6. 파일 내용을 GSC에서 제공한 내용으로 교체
7. 배포 후 "확인" 클릭
-->

<!-- 아래 내용을 GSC에서 제공한 내용으로 교체하세요 -->
google-site-verification: google[YOUR-VERIFICATION-CODE].html
